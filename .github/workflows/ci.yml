# The tests (of the API, of the searches against trying every position, and that a warm match allocates nothing), the
# stack probe, the generated tables and the ECMA-262 test data, with OCaml 4.14 (the library's floor) and 5.5 on Linux,
# 5.5 on macOS (arm64), Windows and Linux on arm64, and the compilers opam-repository's CI tests every package on (flambda
# and no-flat-float-array); and on Linux, the data as its own scripts write it for Unicode 13 and 18 and for the grammar
# of ECMAScript 2020. The data (github.com/corvus-dotnet/ecma262-regex-test-data) is pinned to a commit; the pass is 0
# wrong answers, 0 refusals of a valid pattern, 0 acceptances of an invalid one and 0 matches at their limit, in
# both encodings.
name: ci
on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (OCaml ${{ matrix.ocaml }}${{ matrix.variant && format(' {0}', matrix.variant) || '' }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ocaml: '4.14'
          - os: ubuntu-latest
            ocaml: '5.5'
          - os: ubuntu-24.04-arm
            ocaml: '5.5'
          - os: macos-latest
            ocaml: '5.5'
          - os: windows-latest
            ocaml: '5.5'
          # Compilers configured as opam-repository's CI tests every package on. Each builds the compiler from source.
          - os: ubuntu-latest
            ocaml: '4.14'
            variant: flambda
            compiler: ocaml-variants.4.14.4+options,ocaml-option-flambda
          - os: ubuntu-latest
            ocaml: '5.5'
            variant: flambda
            compiler: ocaml-variants.5.5.1+options,ocaml-option-flambda
          - os: ubuntu-latest
            ocaml: '5.5'
            variant: no-flat-float-array
            compiler: ocaml-variants.5.5.1+options,ocaml-option-no-flat-float-array
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out text files with LF line endings
      run: git config --global core.autocrlf input
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: OCaml
      uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
      with:
        ocaml-compiler: ${{ matrix.compiler || matrix.ocaml }}
        dune-cache: false
        opam-pin: false
    - name: dune
      # The package's only build dependency. The tools need nothing else: str and unix come with the compiler.
      run: opam install --yes dune
    - name: OCaml and dune versions
      run: |
        opam exec -- ocamlopt -version
        opam exec -- dune --version
    - name: Build
      # The dev profile, in which a warning is an error. The build also writes corvus-regex-ecma262.opam from
      # dune-project and the template, so on Linux the step fails if the committed file is not what they give.
      run: |
        opam exec -- dune build
        if [ "$RUNNER_OS" = Linux ] && ! git diff --exit-code -- corvus-regex-ecma262.opam; then
          echo "::error::corvus-regex-ecma262.opam is not what dune-project generates. Run dune build and commit it."
          exit 1
        fi
    - name: The README's example is the one the tests run
      if: runner.os == 'Linux'
      run: diff <(sed -n '/^```ocaml$/,/^```$/p' README.md | sed '1d;$d') test/readme/readme_example.ml
    - name: Test
      run: opam exec -- dune test --force
    - name: Test with the memory of failed places from the first step
      if: runner.os == 'Linux'
      run: opam exec -- dune test --force
      env:
        CORVUS_REGEX_MEMO_FROM_THE_START: '1'
    - name: The stack probe
      # Patterns built to overflow the stack, through every call, on stacks of 4 MB and 2 MB (docs/port-checklist.md):
      # a fault or a process that ends is a failure.
      if: runner.os == 'Linux'
      run: |
        opam exec -- dune build --profile release ./tools/stackprobe/stackprobe.exe
        ./tools/stackprobe/run.sh
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The Unicode tables and the properties of strings are written from the Rust crate's, at the version this engine
      # ports.
      if: runner.os == 'Linux' && matrix.variant == ''
      with:
        repository: corvus-dotnet/corvus-regex-ecma262-rs
        ref: 1036f8707c25b49d826501132619c5671431d685
        path: corvus-regex-ecma262-rs
        persist-credentials: false
    - name: The generated tables are current
      if: runner.os == 'Linux' && matrix.variant == ''
      shell: pwsh
      # The tables and the properties of strings of each version of Unicode, and the property names of ECMAScript 2020.
      run: |
        $src = 'corvus-regex-ecma262-rs/corvus-regex-ecma262/src'
        foreach ($major in 13, 17, 18) {
          ./tools/unicode/gen-ucd-tables.ps1 -CrateTables "$src/tables$major.rs" -Check
          ./tools/unicode/gen-strings.ps1 -CrateStrings "$src/strings$major.rs" -Check
        }
        ./tools/unicode/gen-es2020-properties.ps1 -CrateEs2020 "$src/es2020.rs" -Check
    - name: The version is stamped
      # What a release does before it tags (tools/release/stamp.ps1), with a tag no release has, so that a moved or
      # renamed placeholder fails here and not in a release.
      if: runner.os == 'Linux' && matrix.variant == ''
      shell: pwsh
      run: |
        ./tools/release/stamp.ps1 -Tag v99.98.97
        if (-not (Select-String -Path src/corvus_regex_ecma262.ml -SimpleMatch 'let version = "99.98.97"' -Quiet)) {
          throw 'the version was not stamped'
        }
        git checkout -- dune-project corvus-regex-ecma262.opam src/corvus_regex_ecma262.ml
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 1b4c4353c4fa3fc3e318db32ef0261391519b9a5
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: Run the ECMA-262 test data
      run: |
        opam exec -- dune build --profile release ./tools/dataset/run.exe
        ./_build/default/tools/dataset/run.exe ecma262-regex-test-data/data wrong-cases.tsv
    - name: Run the ECMA-262 test data with the memory of failed places from the first step
      if: runner.os == 'Linux' && matrix.variant == ''
      run: ./_build/default/tools/dataset/run.exe ecma262-regex-test-data/data wrong-cases-memo.tsv
      env:
        CORVUS_REGEX_MEMO_FROM_THE_START: '1'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: runner.os == 'Linux' && matrix.variant == ''
      with:
        node-version: '24.22.1'
    - name: Run the ECMA-262 test data for other versions of Unicode and for ECMAScript 2020
      # The data as its own scripts write it for Unicode 13 and 18 (unicode.js apply) and for the grammar of
      # ECMAScript 2020 (edition.js apply), each judged with the engine set to match.
      if: runner.os == 'Linux' && matrix.variant == ''
      shell: bash
      run: |
        data=ecma262-regex-test-data
        failed=()
        run() {
          name=$1; shift
          out="$RUNNER_TEMP/$name"
          case "$1" in
            unicode.js) node "$data/unicode.js" apply "$2" "$out" "$data/data" ;;
            edition.js) node "$data/edition.js" apply "$out" "$2" "$data/data" ;;
          esac
          shift 2
          ./_build/default/tools/dataset/run.exe "$out" "wrong-cases-$name.tsv" "$@" || failed+=("$name")
        }
        run unicode-13 unicode.js 13.0 --unicode 13
        run unicode-18 unicode.js 18.0 --unicode 18
        # An empty version is the data's own Unicode.
        run es2020 edition.js "" --edition es2020
        run es2020-unicode-13 edition.js 13.0 --edition es2020 --unicode 13
        if [ ${#failed[@]} -gt 0 ]; then echo "::error::Wrong: ${failed[*]}"; exit 1; fi
    - name: Keep the wrong cases
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wrong-cases-${{ matrix.os }}-${{ matrix.ocaml }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
        path: wrong-cases*.tsv

  s390x:
    # A big-endian processor with five registers for the arguments of a C call, which opam-repository's CI builds every
    # package on: the build and the tests in the image it uses, under QEMU (the C kernels' scalar paths, and the passing of
    # their arguments). The test data is too slow to run under emulation and is run on every native leg above.
    name: Build and test (OCaml 5.5, s390x under QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: s390x
    - name: Build and test
      run: |
        docker run --rm --platform linux/s390x -v "$PWD:/src:ro" ocaml/opam:debian-13-ocaml-5.5 sh -ec '
          cp -r /src /tmp/repo && cd /tmp/repo
          opam install --yes dune > /dev/null
          opam exec -- ocamlopt -config-var architecture
          opam exec -- dune build
          opam exec -- dune test --force'

  gate:
    # The one check of this workflow that the ruleset of main requires: it passes when every job above passed (or was
    # skipped), so a job added here is required with no change to the ruleset.
    name: CI gate
    if: always()
    needs: [build, s390x]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        echo "$RESULTS"
        if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
